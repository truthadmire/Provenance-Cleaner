name: ProvenanceCleaner
configs:
  Debug: debug
  DebugTests: debug
  Release: release
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: YES
    ENABLE_USER_SELECTED_FILES: readwrite
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 0.3.1
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ProvenanceCleaner:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
        excludes:
          - Resources
          - Assets.xcassets
      - path: App/Resources
        buildPhase: resources
      - path: App/Assets.xcassets
        buildPhase: resources
      - path: Config/Dependencies.lock.json
        buildPhase: resources
      - path: Config/UpstreamWatermarksRemover.manifest.sha256
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.provenancecleaner.mac
        PRODUCT_NAME: "Provenance Cleaner"
        PRODUCT_MODULE_NAME: ProvenanceCleaner
        EXECUTABLE_NAME: ProvenanceCleaner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Provenance Cleaner"
        INFOPLIST_KEY_CFBundleName: "Provenance Cleaner"
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Provenance Cleaner contributors"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Config/ProvenanceCleaner.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        DebugTests:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_ENTITLEMENTS: Config/TestHost.entitlements
          ENABLE_APP_SANDBOX: NO
          ENABLE_USER_SELECTED_FILES: ""
        Release:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
    postBuildScripts:
      - name: Embed Provenance Engine
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/script/embed_helper.sh" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"
  ProvenanceCleanerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/Unit
    dependencies:
      - target: ProvenanceCleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.provenancecleaner.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Provenance Cleaner.app/Contents/MacOS/ProvenanceCleaner"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
  ProvenanceCleanerUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/UITests
    dependencies:
      - target: ProvenanceCleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.provenancecleaner.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ProvenanceCleaner
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  ProvenanceCleaner:
    build:
      targets:
        ProvenanceCleaner: all
        ProvenanceCleanerTests: [test]
        ProvenanceCleanerUITests: [test]
    run:
      config: Debug
      executable: ProvenanceCleaner
    test:
      config: DebugTests
      gatherCoverageData: true
      targets:
        - name: ProvenanceCleanerTests
        - name: ProvenanceCleanerUITests
          parallelizable: false
    archive:
      config: Release
